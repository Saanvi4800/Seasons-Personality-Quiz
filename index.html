<!DOCTYPE html>
<html lang="en">

<head>
	<title>Seasons Personality Quiz</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="/style.css">

	<!-- import the webpage's javascript file -->
  <script src="script.js" defer></script>

</head>

<body>

	<header>
		<h1>Seasons Personality Quiz!</h1>
		<p>Take this quiz to reveal your season!</p>
	</header>

	<main>

		<h2>What is your favorite subject?</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="assets/math.jpeg" alt="math">
        <br>
        <button id="q1a1">Math</button>
      </div>

      <div class="answer-choice">
        <img src="assets/english.jpeg" alt="english">
        <br>
        <button id="q1a2">English</button>
      </div>

      <div class="answer-choice">
        <img src="assets/science.jpeg" alt="science">
        <br>
        <button id="q1a3">Science</button>
      </div>

      <div class="answer-choice">
        <img src="assets/history.jpeg" alt="history">
        <br>
        <button id="q1a4">History</button>
      </div>

    </div> 
    
    <h2>What do you like to do in your free time?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/bake.jpeg" alt="bake">
        <br>
        <button id="q2a1">Bake</button>
      </div>

      <div class="answer-choice">
        <img src="assets/music.jpeg" alt="music">
        <br>
        <button id="q2a2">Music</button>
      </div>
      
      <div class="answer-choice">
        <img src="assets/code.jpeg" alt="code">
        <br>
        <button id="q2a3">Code</button>
      </div>

      <div class="answer-choice">
        <img src="assets/sport.jpeg" alt="sports">
        <br>
        <button id="q2a4">Sports</button>
      </div>

    </div> 
    
    <h2>How would your friends describe you?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/outgoing.jpeg" alt="outgoing">
        <br>
        <button id="q3a1">Extrovert</button>
      </div>

      <div class="answer-choice">
        <img src="assets/quiet.jpeg" alt="quiet">
        <br>
        <button id="q3a2">Introvert</button>
      </div>

      <div class="answer-choice">
        <img src="assets/middle.jpeg" alt="middle">
        <br>
        <button id="q3a3">Ambivert</button>
        <br>
      </div>
      
      <div class="result-section">
       <button id="displayResult">What kind of person am I?</button>
       <br>
       <h2 id="result">You are a...</h2>
       <br>
       <button id="restart">Restart</button>
      </div>
     

    </div> 
    
    
  </main>
  </body>
</html>
