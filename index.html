<!DOCTYPE html>
<html lang="en">

<head>
	<title>Seasons Personality Quiz</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="/style.css">

	<!-- import the webpage's javascript file -->
	<script src="/script.js" defer>

	</script>
</head>

<body>

	<header>
		<h1>Seasons Personality Quiz!</h1>
		<p>Take this quiz to reveal your season!</p>
	</header>

	<main>

		<h2>What is your favorite subject?</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q1a1">Math</button>
      </div>

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q1a2">English</button>
      </div>

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q1a3">Science</button>
      </div>

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q1a4">History</button>
      </div>

    </div> 
    
    <h2>What do you like to do in your free time?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q2a1">Bake</button>
      </div>

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q2a2">Listen to music</button>
      </div>
      
      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q2a3">Code</button>
      </div>

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q2a4">Sports</button>
      </div>

    </div> 
    
    <h2>How would your friends describe you?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q3a1">Outgoing and talkative</button>
      </div>

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q3a2">Quiet and Reserved</button>
      </div>

      <div class="answer-choice">
        <img src="assets/cat.jpg" alt="A striped black and white cat sitting upright with folded arms">
        <br>
        <button id="q3a3">Somewhere in the middle</button>
      </div>

    </div> 
    
    <h2 id="result">Your result is...</h2>
    
    
  </main>
  </body>
</html>
